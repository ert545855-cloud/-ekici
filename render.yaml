services:
  - type: web
    name: yolda-kaldik
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Europe/Istanbul
      - key: DEMO_MODE
        value: "true"
      - key: SUBSCRIPTION_PRICE
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        value: "05000000000"
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
